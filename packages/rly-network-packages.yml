notes: >-
  RLY Network / Rally Protocol ships client SDKs, not a hosted REST API. The
  SDKs embed self-custodial wallets and execute gasless (GSN-relayed)
  transactions on-device. Packages confirmed first-party from the rally-dfs
  GitHub org, the npm registry, and the rallyprotocol.com verified pub.dev
  publisher.
