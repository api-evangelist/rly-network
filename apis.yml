name: RLY Network
description: >-
  RLY Network (Rally Protocol) is a permissionless, open-source web3 toolkit that
  lets mobile and game developers add blockchain features to consumer apps without
  requiring users to understand crypto. Its core products are natively embedded,
  self-custodial wallets — keys are generated and encrypted in the device secure
  enclave with cloud backup, no signups or third-party logins — and gasless
  transactions, where minting, claiming, and transferring tokens or NFTs are
  relayed through a GSN gas-station paymaster so end users never pay gas. RLY ships
  first-party SDKs for React Native/Expo, Flutter, and Unity rather than a hosted
  REST API; developers get a project API key from the RallyProtocol dashboard and
  build on Base. The RLY Network Association is backed by a16z, Coinbase Ventures,
  and Battery Ventures.
